name: SBOM

on:
  release:
    types: [published]

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: none
      checks: none
      deployments: none
      issues: none
      packages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install syft
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/3e2bc6ed095f7ec1a415fb38cfe1c319e95dfed6/install.sh | sh -s -- -b /usr/local/bin v1.48.0

      - name: Copy lock file for syft
        shell: bash
        run: |
          cp "${{ github.workspace }}/src/requirements.lock" "${{ github.workspace }}/requirements-transitive.txt"

      - name: Generate SBOM
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          syft dir:"${{ github.workspace }}" \
            --source-name contrast-ai-smartfix-action \
            --source-version "$TAG_NAME" \
            -o cyclonedx-json=sbom.cdx.json

      - name: Remove temp lock file
        if: always()
        shell: bash
        run: |
          rm -f "${{ github.workspace }}/requirements-transitive.txt"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Attach SBOM to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" sbom.cdx.json --clobber
